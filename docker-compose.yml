version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ats_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hr_stream}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ats-network

  minio:
    image: minio/minio:latest
    container_name: ats_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_admin_password_123}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - ats-network

  minio-setup:
    image: minio/mc:latest
    container_name: ats_minio_setup
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "
      set -e;
      echo 'Waiting for MinIO to be ready...';
      until mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do
        echo '...waiting for minio to start...';
        sleep 3;
      done;
      echo 'MinIO is ready, configuring bucket...';
      mc mb -p myminio/${MINIO_BUCKET_NAME:-ats-resumes} || echo 'Bucket may already exist';
      mc anonymous set private myminio/${MINIO_BUCKET_NAME:-ats-resumes};
      echo 'Bucket created and set to private';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_admin_password_123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-ats-resumes}
    networks:
      - ats-network

  app:
    build:
      context: .
    container_name: hr_stream_app
    depends_on:
      - postgres
      - minio
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hr_stream}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_123}
      JWT_SECRET: ${JWT_SECRET:-MySecretKey123!@$%^&*()_+{}|:<>?[]\\,./}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_admin_password_123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-ats-resumes}
      S3_ENDPOINT: http://minio:9000
    ports:
      - "8090:8090"
    networks:
      - ats-network

volumes:
  pgdata:
  minio-data:

networks:
  ats-network:
    driver: bridge

