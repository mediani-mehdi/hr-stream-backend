# redis.conf
# Production-leaning defaults for ATS

# Security
# NOTE: We'll still pass --requirepass at runtime in docker-compose using a secret.
# If you decide to mount this file and rely on it instead, replace ${REDIS_PASSWORD}
# during container start (Redis doesn't expand env vars inside redis.conf).

# Memory
maxmemory 512mb
maxmemory-policy allkeys-lru

# Durability
appendonly yes
appendfsync everysec

# Networking
bind 0.0.0.0
protected-mode yes
port 6379

# General
timeout 0
tcp-keepalive 300

# Logging
loglevel notice

