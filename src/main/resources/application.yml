spring:
  application:
    name: hr-stream

  sql:
    init:
      mode: always

  autoconfigure:
    exclude:
      # Spring AI starters auto-configure all model types; the app wires its own beans in AiProviderConfig
      - org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HrStreamHikari
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 1800000
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  data:
    redis:
      client-type: lettuce

  cache:
    type: redis

server:
  port: 8090
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

# Seed admin user (created on first boot if no user with that email exists)
app:
  seed:
    admin:
      enabled: ${SEED_ADMIN_ENABLED:true}
      email: ${SEED_ADMIN_EMAIL:admin@hrstream.com}
      password: ${SEED_ADMIN_PASSWORD:admin123}
  # ATS scoring pipeline configuration
  scoring:
    rule-min-score: 40
    ai-min-score: 60
    max-applications: 100
    required-skill-weight: 60
    nice-skill-weight: 25
    experience-keyword-weight: 15
    prompt-char-budget: 20000
    min-extracted-chars: 50
    stuck-after-minutes: 15
  scheduling:
    deadline-check-cron: "0 */5 * * * *"
    stuck-resumer-cron: "0 */2 * * * *"

# AI provider gateway (LM Studio primary, then OpenRouter, Gemini, Claude, GLM)
ai:
  providers:
    order: [lmstudio, openrouter, gemini, claude, glm]
    lm-studio:
      enabled: true
      base-url: ${LMSTUDIO_BASE_URL:http://127.0.0.1:1234}
      model: ${LMSTUDIO_MODEL:qwen2.5-coder-0.5b-instruct}
      timeout-ms: 60000
    openrouter:
      enabled: ${OPENROUTER_ENABLED:false}
      api-key: ${OPENROUTER_API_KEY:}
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api}
      model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
      timeout-ms: 30000
    gemini:
      enabled: ${AI_GEMINI_ENABLED:true}
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:}
      model: ${GEMINI_AI_MODEL:gemini-2.0-flash}
      timeout-ms: 30000
    claude:
      enabled: ${CLAUDE_ENABLED:false}
      api-key: ${CLAUDE_API_KEY:}
      base-url: ${CLAUDE_BASE_URL:https://api.anthropic.com}
      model: ${CLAUDE_MODEL:claude-3-5-haiku-latest}
      timeout-ms: 30000
    glm:
      enabled: ${GLM_ENABLED:false}
      api-key: ${GLM_API_KEY:}
      base-url: ${GLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
      model: ${GLM_MODEL:glm-4-flash}
      timeout-ms: 30000
  scoring:
    max-retries-per-provider: 1
    backoff-ms: 500

# Resilience4j circuit breakers (one per provider)
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      ai-lmstudio:
        baseConfig: default
      ai-openrouter:
        baseConfig: default
      ai-gemini:
        baseConfig: default
      ai-claude:
        baseConfig: default
      ai-glm:
        baseConfig: default

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:admin}
  secretKey: ${MINIO_SECRET_KEY:admin123}
  bucket: ${MINIO_BUCKET:hr-stream}
  region: ${MINIO_REGION:us-east-1}

jwt:
  secret: ${JWT_SECRET:default-secret-for-local-dev-change-for-prod}
